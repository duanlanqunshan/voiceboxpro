<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SRT 字幕转语音</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      padding: 30px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }
    h1 { color: #1a1a2e; margin-bottom: 8px; }
    .subtitle { color: #666; margin-bottom: 30px; }
    .form-group { margin-bottom: 20px; }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #333;
    }
    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #0070f3;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #0070f3;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #0051a2; }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .error {
      padding: 15px;
      background: #fce4e4;
      color: #c33;
      border-radius: 6px;
      margin-bottom: 20px;
    }
    .success {
      padding: 20px;
      background: #e6f4ea;
      border-radius: 6px;
      margin-bottom: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      padding: 10px;
      border: 1px solid #e0e0e0;
      text-align: left;
      font-size: 13px;
    }
    th { background: #f8f9fa; font-weight: 600; }
    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
    }
    .badge-low { background: #d4edda; color: #155724; }
    .badge-medium { background: #fff3cd; color: #856404; }
    .badge-high { background: #f8d7da; color: #721c24; }
    .hidden { display: none; }
    #preview { max-height: 300px; overflow-y: auto; }
    .progress {
      width: 100%;
      height: 6px;
      background: #f0f0f0;
      border-radius: 3px;
      margin-top: 10px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: #0070f3;
      transition: width 0.3s;
      width: 0%;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>SRT 字幕转语音</h1>
    <p class="subtitle">上传 SRT 文件，按字幕时间轴生成语音</p>

    <form id="uploadForm">
      <div class="form-group">
        <label for="srtFile">SRT 文件</label>
        <input type="file" id="srtFile" accept=".srt" required />
      </div>

      <div class="form-group">
        <label for="profileId">Profile ID（语音 ID）</label>
        <input type="text" id="profileId" placeholder="例如：abc123-def..." required />
      </div>

      <div class="form-group">
        <label for="engine">TTS 引擎</label>
        <select id="engine">
          <option value="qwen" selected>Qwen TTS</option>
          <option value="luxtts">LuxTTS</option>
          <option value="chatterbox">Chatterbox</option>
          <option value="tada">TADA</option>
          <option value="kokoro">Kokoro</option>
        </select>
      </div>

      <div class="form-group">
        <label for="language">语言</label>
        <select id="language">
          <option value="zh" selected>中文</option>
          <option value="en">英文</option>
          <option value="ja">日文</option>
          <option value="ko">韩文</option>
        </select>
      </div>

      <button type="submit" id="submitBtn">开始生成</button>
    </form>

    <div class="progress hidden" id="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div id="error" class="error hidden"></div>

    <div id="result" class="hidden">
      <h3 style="margin-top: 30px; margin-bottom: 15px;">生成结果</h3>
      <div class="success" id="summary"></div>
      <div id="preview"></div>
    </div>
  </div>

  <script>
    const API_BASE = '';
    
    function formatTime(ms) {
      const h = Math.floor(ms / 3600000);
      const m = Math.floor((ms % 3600000) / 60000);
      const s = Math.floor((ms % 60000) / 1000);
      const millis = ms % 1000;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')},${String(millis).padStart(3, '0')}`;
    }

    function showError(msg) {
      const el = document.getElementById('error');
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    function hideError() {
      document.getElementById('error').classList.add('hidden');
    }

    function showProgress(pct) {
      document.getElementById('progress').classList.remove('hidden');
      document.getElementById('progressBar').style.width = pct + '%';
    }

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      
      const file = document.getElementById('srtFile').files[0];
      if (!file) {
        showError('请选择 SRT 文件');
        return;
      }

      const profileId = document.getElementById('profileId').value;
      if (!profileId) {
        showError('请输入 Profile ID');
        return;
      }

      const formData = new FormData();
      formData.append('srt_file', file);
      formData.append('profile_id', profileId);
      formData.append('engine', document.getElementById('engine').value);
      formData.append('language', document.getElementById('language').value);

      document.getElementById('submitBtn').disabled = true;
      showProgress(30);

      try {
        const response = await fetch(`${API_BASE}/generate/srt`, {
          method: 'POST',
          body: formData,
        });

        showProgress(70);

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || `HTTP ${response.status}`);
        }

        showProgress(100);
        renderResult(data);
      } catch (err) {
        showError('生成失败：' + err.message);
      } finally {
        document.getElementById('submitBtn').disabled = false;
      }
    });

    function renderResult(data) {
      const resultEl = document.getElementById('result');
      resultEl.classList.remove('hidden');

      document.getElementById('summary').innerHTML = `
        <p><strong>故事名：</strong>${data.story_name}</p>
        <p><strong>总 cue 数：</strong>${data.total_cues}</p>
        <p><strong>成功：</strong>${data.success_count} / <strong>失败：</strong>${data.failed_count}</p>
        <p><strong>状态：</strong>${data.status}</p>
      `;

      if (data.items && data.items.length > 0) {
        let html = '<table><thead><tr><th>#</th><th>时间</th><th>文本</th><th>拉伸比</th><th>风险</th><th>状态</th></tr></thead><tbody>';
        
        data.items.forEach(item => {
          const riskClass = item.fit_risk === 'low' ? 'badge-low' : 
                           item.fit_risk === 'medium' ? 'badge-medium' : 'badge-high';
          
          html += `<tr>
            <td>${item.cue_index}</td>
            <td style="font-size:12px">${formatTime(item.cue_start_ms)} → ${formatTime(item.cue_end_ms)}</td>
            <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis">${item.text}</td>
            <td>${item.fit_ratio.toFixed(2)}</td>
            <td><span class="badge ${riskClass}">${item.fit_risk}</span></td>
            <td>${item.error ? `<span title="${item.error}">失败</span>` : '成功'}</td>
          </tr>`;
        });
        
        html += '</tbody></table>';
        document.getElementById('preview').innerHTML = html;
      }
    }
  </script>
</body>
</html>
